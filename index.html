<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="captureCanvas" style="display:none;"></canvas>

    <!-- Mobile panel toggle (bottom sheet FAB) -->
    <button class="panel-toggle" id="panelToggle" aria-label="Toggle settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="6" cy="4" r="1.5"/><line x1="9" y1="4" x2="16" y2="4"/><line x1="2" y1="4" x2="4.5" y2="4"/>
            <circle cx="12" cy="9" r="1.5"/><line x1="2" y1="9" x2="10.5" y2="9"/><line x1="13.5" y1="9" x2="16" y2="9"/>
            <circle cx="7" cy="14" r="1.5"/><line x1="2" y1="14" x2="5.5" y2="14"/><line x1="8.5" y1="14" x2="16" y2="14"/>
        </svg>
    </button>
    <div class="panel-backdrop" id="panelBackdrop"></div>

    <!-- Left control panel -->
    <div class="style-panel" id="stylePanel">
        <div class="panel-header" id="panelHeader">
            <h3>ASCII Camera</h3>
            <button class="panel-collapse-btn" id="panelCollapseBtn" aria-label="Collapse panel">
                <svg class="chevron-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="2 8 6 4 10 8"/>
                </svg>
            </button>
        </div>

        <section class="panel-section">
            <h4 class="section-title">Presets</h4>
            <div class="style-options">
                <button class="style-btn active" data-style="classic">
                    <span class="style-name">Punk</span>
                    <span class="style-chars">@%#*+=-:.</span>
                </button>
                <button class="style-btn" data-style="numbers">
                    <span class="style-name">Y2K</span>
                    <span class="style-chars">9876543210</span>
                </button>
                <button class="style-btn" data-style="hindi">
                    <span class="style-name">Mantra</span>
                    <span class="style-chars">. १ २ ३ ५ ९ र न म भ</span>
                </button>
                <button class="style-btn" data-style="matrix">
                    <span class="style-name">Red Pill</span>
                    <span class="style-chars">01アイウエオカキク</span>
                </button>
                <button class="style-btn" data-style="blocks">
                    <span class="style-name">Tetris</span>
                    <span class="style-chars">█▓▒░ </span>
                </button>
                <button class="style-btn" data-style="minimal">
                    <span class="style-name">Vapor</span>
                    <span class="style-chars">.·:- </span>
                </button>
            </div>
        </section>

        <section class="panel-section">
            <h4 class="section-title">Custom Charset <span class="hint">dark → light</span></h4>
            <div class="custom-charset-row">
                <input type="text" id="customCharset" class="custom-input" placeholder="e.g.  #Oo. ">
                <button id="applyCustom" class="apply-btn">Apply</button>
            </div>
        </section>

        <section class="panel-section">
            <h4 class="section-title">Density</h4>
            <div class="density-control">
                <input type="range" id="densitySlider" min="0.5" max="2" step="0.1" value="1" class="density-slider">
                <span id="densityValue" class="density-value">1.0×</span>
            </div>
        </section>

        <section class="panel-section">
            <h4 class="section-title">Display</h4>
            <div class="toggle-row">
                <label class="toggle-label">
                    <input type="checkbox" id="hideBoxToggle" class="toggle-checkbox">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-text">Fullscreen ASCII</span>
                </label>
            </div>
            <div class="toggle-row">
                <label class="toggle-label">
                    <input type="checkbox" id="colorModeToggle" class="toggle-checkbox">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    <span class="toggle-text">Color Mode</span>
                </label>
            </div>
        </section>

        <section class="panel-section color-section" id="colorSection">
            <h4 class="section-title">ASCII Color</h4>
            <div class="color-picker-container">
                <div class="color-gradient" id="colorGradient">
                    <div class="color-selector" id="colorSelector"></div>
                </div>
                <div class="hue-slider-container">
                    <div class="hue-slider" id="hueSlider">
                        <div class="hue-selector" id="hueSelector"></div>
                    </div>
                </div>
                <div class="color-info">
                    <div class="color-swatch-container">
                        <div class="color-swatch" id="colorSwatch"></div>
                    </div>
                    <div class="color-inputs">
                        <div class="hex-input-container">
                            <label>Hex</label>
                            <input type="text" id="hexInput" value="#00ff00" class="hex-input" placeholder="#00ff00" maxlength="7">
                        </div>
                    </div>
                </div>
                <div class="color-slots" id="colorSlots"></div>
            </div>
        </section>

        <section class="panel-section">
            <h4 class="section-title">Export</h4>
            <div class="export-controls">
                <button id="downloadTextBtn" disabled>Text</button>
                <button id="downloadImageBtn" disabled>Image</button>
                <button id="downloadVideoBtn" disabled>● Rec</button>
                <button id="stopVideoBtn" disabled style="display:none;">■ Stop</button>
            </div>
        </section>
    </div>

    <div id="errorMsg" class="error-message" style="display:none;"></div>

    <div id="countdownOverlay" class="countdown-overlay" style="display:none;">
        <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <!-- ASCII overlay box (draggable + resizable) -->
    <div id="asciiBox" class="ascii-box">
        <canvas id="asciiCanvas" class="ascii-canvas"></canvas>
        <div class="resize-handle resize-handle-nw"></div>
        <div class="resize-handle resize-handle-ne"></div>
        <div class="resize-handle resize-handle-sw"></div>
        <div class="resize-handle resize-handle-se"></div>
        <div class="resize-handle resize-handle-n"></div>
        <div class="resize-handle resize-handle-s"></div>
        <div class="resize-handle resize-handle-w"></div>
        <div class="resize-handle resize-handle-e"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
